# ============================================================
# Medical Image Storage System - Application Configuration
# ============================================================

server:
  port: 8085
  servlet:
    context-path: /

spring:
  application:
    name: medical-image-storage

  # ── MySQL DataSource ──────────────────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/medical_imaging?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA / Hibernate ──────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update          # Use 'validate' in production
    show-sql: false             # Set to true for debug
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  # ── File Upload Limits ───────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 110MB

# ── SeaweedFS Configuration ──────────────────────────────────
seaweedfs:
  master-url: http://localhost:9333    # SeaweedFS master node
  volume-url: http://localhost:8080    # SeaweedFS volume node (default)
  assign-endpoint: /dir/assign         # Endpoint to get a new file ID
  replication: ""                      # e.g. "001" for 1 replica; blank = default

# ── SpringDoc / Swagger UI ────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

# ── Logging ───────────────────────────────────────────────────
logging:
  level:
    com.medicalstorage: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/medical-storage.log
